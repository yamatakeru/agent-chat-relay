# cc-connect 1.5.0 標準の LINE platform で実測するための設定（段階 1）
#
# scripts/line-native.sh run がこのファイルを直接読ませる。cc-connect は起動中、同じディレクトリに
# .config.toml.lock を作る（.gitignore 対象）。一部のコマンドや管理 API はこのファイルを書き換えるため、
# 書き換えにつながる LINE からのコマンドは disabled_commands で無効にしている。
# 秘密情報と userId はすべて環境変数から ${VAR} で注入する（docs/line-native-verification.md 参照）。

language = "ja"
data_dir = "${CCJ_LINE_NATIVE_HOME}/data"

[log]
# debug にすると、許可していない送信者の userId と発言内容がログに出る（userId の取得に使う）
level = "${CCJ_LOG_LEVEL}"

[display]
# 通数を節約するため、思考とツールの経過は出さず、最終回答を中心に送る
mode = "quiet"

[[projects]]
name = "line-verify"
# 返信末尾のフッター（モデル名・トークン数・作業ディレクトリの絶対パス）をルームに出さない
reply_footer = false
# admin_from は設定しない。/shell /dir /restart などの特権コマンドは誰も使えない。
#
# 依頼者が実行承認を迂回したり設定を変えたりできるコマンドを無効にする。
# /new /stop /status /whoami /help などの会話操作は残す。
disabled_commands = [
  "mode", "allow", "provider", "model", "reasoning", "config", "commands",
  "cron", "timer", "heartbeat", "memory", "workspace", "bind", "alias",
  "skills", "lang", "quiet", "tts", "web", "delete", "compress",
]

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "${CCJ_LINE_NATIVE_HOME}/workspace"
# 権限モードは標準。ツールを実行するたびに実行承認を求める
mode = "default"
# ユーザー設定（~/.claude/settings.json）の allow ルールや hooks を読み込ませない。
# 読み込むと、find や uv のような任意のコードを実行できるコマンドが、承認なしで通ってしまう
cmd = "claude --setting-sources project,local"

[[projects.platforms]]
type = "line"

[projects.platforms.options]
channel_secret = "${CCJ_LINE_CHANNEL_SECRET}"
channel_token = "${CCJ_LINE_CHANNEL_TOKEN}"
# カンマ区切りの LINE userId。空や "*" は全員許可になるため、scripts 側で空を禁止している
allow_from = "${CCJ_LINE_ALLOW_FROM}"
port = "${CCJ_LINE_PORT}"
callback_path = "/callback"
