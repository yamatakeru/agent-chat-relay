# 自作の LINE アダプターと cloud_web でつなぐための cc-connect 1.5.0 の設定（段階 2）
#
# scripts/line.sh cc がこのファイルを直接読ませる。cc-connect は起動中、同じディレクトリに
# .config.toml.lock を作る（.gitignore 対象）。秘密情報と userId は環境変数から ${VAR} で注入する。
# アダプターの振る舞いは docs/line-adapter.md、つなぎ方は ADR 0003・0004 にある。

language = "ja"
data_dir = "${CCJ_LINE_HOME}/data"

[log]
level = "${CCJ_LOG_LEVEL}"

[display]
# 通数を節約するため、思考とツールの経過は出さず、最終回答を中心に送る
mode = "quiet"

[[projects]]
name = "line"
# ルームごとに作業場所を分ける。割り当ては、アダプターが data_dir/workspace_bindings.json に書く（ADR 0004）
mode = "multi-workspace"
base_dir = "${CCJ_LINE_HOME}/workspaces"
# 返信末尾のフッター（モデル名・トークン数・作業ディレクトリの絶対パス）をルームに出さない
reply_footer = false
# admin_from は設定しない。/shell /dir /restart などの特権コマンドは誰も使えない。
#
# 依頼者が実行承認を迂回したり設定を変えたりできるコマンドを無効にする。
# /workspace は任意のディレクトリの割り当てや clone につながるので無効にする。
# /new /stop /status /whoami /help などの会話操作は残す。
disabled_commands = [
  "mode", "allow", "provider", "model", "reasoning", "config", "commands",
  "cron", "timer", "heartbeat", "memory", "workspace", "bind", "alias",
  "skills", "lang", "quiet", "tts", "web", "delete", "compress",
]

[projects.agent]
type = "claudecode"

[projects.agent.options]
# 権限モードは標準。ツールを実行するたびに実行承認を求める
mode = "default"
# --setting-sources：ユーザー設定（~/.claude/settings.json）の allow ルールや hooks を読み込ませない。
# 読み込むと、find や uv のような任意のコードを実行できるコマンドが、承認なしで通ってしまう
# claudeMdExcludes：AGENTS.md・CLAUDE.md を読み込ませない。--setting-sources を指定しても、
# ユーザーの ~/.claude/CLAUDE.md は読み込まれる（2.1.318 で確認）。上位ディレクトリの AGENTS.md も対象
# autoMemoryEnabled：自動メモリを無効にする。ユーザー設定で無効にしていても、--setting-sources で外れる
cmd = [
  "claude", "--setting-sources", "project,local",
  "--settings", '{"claudeMdExcludes":["**/AGENTS.md","**/CLAUDE.md"],"autoMemoryEnabled":false}',
]

[[projects.platforms]]
type = "cloud_web"

[projects.platforms.options]
# アダプター（127.0.0.1 だけで待つ）へ cc-connect が接続しにいく
name = "line"
transport = "websocket"
token = "${CCJ_CLOUDWEB_TOKEN}"
ws_url = "ws://127.0.0.1:${CCJ_CLOUDWEB_PORT}/cloud-web/ws"
# アダプターでも判定するが、念のため cc-connect でも絞る。空や "*" は scripts 側で禁止している
allow_from = "${CCJ_LINE_ALLOW_FROM}"
# セッションをルーム単位にする（line:<ルームの ID>）
share_session_in_channel = true
# 渡す発言はアダプターが選び、すべて mentioned を付けて渡す。付いていない発言は念のため捨てる
group_reply_all = false
